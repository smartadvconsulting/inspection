<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>99 Oakland Hill inspection</title>
<script src="config.js"></script>
<style>
  :root { --bg:#eef0f3; --card:#fff; --ink:#1d2733; --muted:#5f6b78; --line:#d5dae0; --blue:#1f5f99;
          --good:#1b7a3a; --wear:#a86400; --dmg:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg);
         color:var(--ink); font-size:16px; line-height:1.35; }
  header { position:sticky; top:0; z-index:5; background:#24303c; color:#fff; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:none; border:1px solid rgba(255,255,255,.45); color:#fff; border-radius:6px; padding:6px 10px; font-size:14px; }
  header #sync { font-size:12px; padding:5px 9px; border-radius:10px; border:0; background:#3b4957; white-space:nowrap; }
  header #sync.warn { background:var(--wear); }
  main { padding:12px; max-width:640px; margin:0 auto 96px; }
  h2 { font-size:18px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=email], input[type=number], input[type=password], textarea {
    width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:72px; resize:vertical; }
  .btn { display:block; width:100%; padding:14px; border-radius:9px; border:0; background:var(--blue); color:#fff; font-size:16px; font-weight:600; margin-top:12px; }
  .btn.sec { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  .btn:disabled { background:#a3adb8; color:#f3f5f7; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:11px 4px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:15px; color:var(--ink); }
  .seg button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .row2 { display:flex; gap:10px; } .row2 > div { flex:1; min-width:0; }
  .bar { height:8px; background:#dde2e8; border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:var(--good); }
  .muted { color:var(--muted); font-size:14px; }
  .err { color:var(--dmg); font-size:14px; margin-top:8px; min-height:1px; }
  .room { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; background:#fff; border:1px solid var(--line);
          border-radius:10px; margin-bottom:8px; width:100%; font-size:16px; text-align:left; color:var(--ink); }
  .room .done { color:var(--good); font-weight:600; font-size:14px; }
  .room .left { color:var(--muted); font-size:14px; white-space:nowrap; }
  .item { background:#fff; border:1px solid var(--line); border-left:5px solid #c3c9d1; border-radius:10px; padding:12px; margin-bottom:10px; }
  .item.ok { border-left-color:var(--good); }
  .item .ref { font-size:12px; color:var(--muted); }
  .item .name { font-weight:600; margin:1px 0 2px; }
  .item .hint { font-size:14px; color:var(--muted); }
  .item .status { font-size:13px; font-weight:600; color:var(--wear); margin-top:8px; }
  .item.ok .status { color:var(--good); }
  .rate { display:flex; gap:6px; margin-top:10px; }
  .rate button { flex:1; padding:12px 4px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:15px; color:var(--ink); }
  .rate button.on.Good { background:var(--good); border-color:var(--good); color:#fff; }
  .rate button.on.Wear { background:var(--wear); border-color:var(--wear); color:#fff; }
  .rate button.on.Damage { background:var(--dmg); border-color:var(--dmg); color:#fff; }
  .note { margin-top:10px; }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .thumb { width:84px; height:84px; border-radius:6px; border:1px solid var(--line); object-fit:cover; background:#e3e7ec;
           font-size:11px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); padding:3px; }
  .pbtn { padding:12px 14px; border-radius:8px; border:1px dashed var(--blue); background:#f3f7fb; color:var(--blue); font-size:15px; }
  .link { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:11px 0; font-size:15px; color:var(--ink); }
  .link:last-child { border-bottom:0; }
  .sig { width:100%; height:170px; border:1px solid var(--line); border-radius:8px; background:#fff; touch-action:none; display:block; }
  .small-btn { background:none; border:0; color:var(--blue); font-size:14px; padding:8px 0; }
  .check { display:flex; gap:10px; align-items:center; margin-top:14px; font-size:15px; color:var(--ink); }
  .check input { width:22px; height:22px; }
  .counts { display:flex; gap:8px; text-align:center; margin-top:8px; }
  .counts div { flex:1; background:#f5f7f9; border-radius:8px; padding:8px 4px; font-size:13px; color:var(--muted); }
  .counts b { display:block; font-size:20px; color:var(--ink); }
  .overlay { position:fixed; inset:0; background:rgba(15,20,26,.94); z-index:20; display:flex; flex-direction:column; align-items:center;
             justify-content:center; color:#fff; padding:16px; text-align:center; }
  .overlay video { width:100%; max-width:560px; max-height:68vh; background:#000; border-radius:8px; }
  .overlay .row2 { width:100%; max-width:560px; }
  .overlay .small-btn { color:#cfe0f2; margin-top:10px; }
  .toast { position:fixed; left:12px; right:12px; bottom:84px; background:#24303c; color:#fff; padding:12px 14px; border-radius:9px; z-index:30; font-size:15px; }
  .footer { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px; z-index:4; }
  .footer .btn { margin:0 auto; max-width:616px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #7fb0e0; outline-offset:1px; }
</style>
<script>
  // Runs before the main script. If anything stops the app from starting, say so on the page.
  window.APP_STARTED = false;
  function showStartupProblem(msg) {
    window.STARTUP_PROBLEM_SHOWN = true;
    var box = document.getElementById('app');
    if (!box) { document.addEventListener('DOMContentLoaded', function () { showStartupProblem(msg); }); return; }
    box.innerHTML = '<div style="background:#fff;border:1px solid #d5dae0;border-radius:10px;padding:14px;margin:12px">' +
      '<h2 style="margin:0 0 8px;font-size:18px">The form did not start</h2><p style="margin:0 0 8px"></p>' +
      '<p style="margin:0;color:#5f6b78;font-size:14px">Page version 2026-09-16a. Send a screenshot of this message if it keeps happening.</p></div>';
    box.querySelector('p').textContent = msg;
  }
  window.addEventListener('error', function (e) {
    if (!window.APP_STARTED && !window.STARTUP_PROBLEM_SHOWN) showStartupProblem('Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
  });
  setTimeout(function () {
    if (!window.APP_STARTED && !window.STARTUP_PROBLEM_SHOWN) showStartupProblem('The page did not finish starting after 45 seconds. Check signal and reload.');
  }, 45000);
</script>
</head>
<body>
<header>
  <button id="back" hidden>Back</button>
  <h1 id="title">Inspection</h1>
  <button id="sync" data-act="sync" hidden></button>
</header>
<main id="app"></main>
<div id="footer" class="footer" hidden></div>

<script>
/* The Web app URL lives in config.js next to this file, so index.html can be replaced without re-pasting it. */
const API_URL = String(window.INSPECTION_API_URL || '').trim();
const PAGE_VERSION = '2026-09-16a';

const CFG = { property: '99 Oakland Hill', maxAge: 3, requireGps: true, tz: 'Africa/Johannesburg', maxPhotos: 3 };
const RATINGS = ['Good', 'Wear', 'Damage'];
const TYPES = ['Move-in', 'Renewal', 'Move-out'];
const UPLOAD_LANES = 2;                                        // photos sent at the same time
const FILE_FIELDS = ['fileId', 'url', 'smallId', 'name', 'receivedAt'];

const S = {
  pin: store('get', 'pin') || '', view: 'pin', drafts: [], insp: null, checklist: [], results: {}, room: null,
  gps: null, watching: false, noLive: false, offlineMode: false, busyPhoto: false,
  startDraft: {}, editStart: false, busy: false,
  sig: { agent: null, tenant: null }, sign: { declined: false, reason: '', comments: '' },
  noteTimers: {}, doneInfo: null
};

/* ---------- small helpers ---------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function store(op, k, v) {
  try { return op === 'get' ? sessionStorage.getItem(k) : sessionStorage.setItem(k, v); } catch (e) { return null; }
}
function local(op, k, v) {
  try { return op === 'get' ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; }
}
function toast(msg, ms) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3500);
}
function overlay(html) {
  const o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = html;
  document.body.appendChild(o); return o;
}
function fmtSA(d) {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: CFG.tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(d)
    .reduce((a, x) => { a[x.type] = x.value; return a; }, {});
  return p.year + '-' + p.month + '-' + p.day + ' ' + (p.hour === '24' ? '00' : p.hour) + ':' + p.minute + ':' + p.second;
}
function gpsText(g) {
  return g ? g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + ' (+/- ' + Math.round(g.acc) + ' m)' : 'Not available';
}

function bufToB64(buf) {
  const u = new Uint8Array(buf), step = 0x8000;
  let s = '';
  for (let i = 0; i < u.length; i += step) s += String.fromCharCode.apply(null, u.subarray(i, i + step));
  return btoa(s);
}
async function sha256Hex(buf) {
  try {
    const d = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return ''; }
}
function canvasBuf(c, quality) {
  return new Promise((resolve, reject) => {
    c.toBlob(b => {
      if (!b) return reject(new Error('Could not make the photo file.'));
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error);
      fr.readAsArrayBuffer(b);
    }, 'image/jpeg', quality);
  });
}
/** 20260916-101523 in SAST, for file names. */
function fileStamp(d) { return fmtSA(d).replace(/[-:]/g, '').replace(' ', '-'); }
function pinHash(pin) { return sha256Hex(new TextEncoder().encode('oakland-hill|' + pin)); }

/* ---------- server calls ---------- */
function newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

/** Error text for the agent. */
function errText(e) {
  if (e && e.glitch) return 'Google did not send an answer back. Your last change may have saved. Wait a moment and try again.';
  if (e && e.network) return 'No connection. Check signal and try again.';
  if (e && e.busy) return (e.message || 'Busy') + ' Try again in a moment.';
  return (e && e.message) || 'Something went wrong.';
}

/**
 * Google sometimes loses the answer on the way back (a 404 page from script.googleusercontent.com)
 * even though the script ran. Try again a few times before giving up.
 */
async function call(action, extra) {
  const tries = [0, 1500, 4000, 8000];
  let last;
  for (let i = 0; i < tries.length; i++) {
    if (tries[i]) await sleep(tries[i]);
    try { return await callOnce(action, extra); }
    catch (e) {
      last = e;
      if (!e.glitch) throw e;
    }
  }
  last.network = true;   // the sync keeps retrying these
  throw last;
}

function callOnce(action, extra) {
  const body = JSON.stringify(Object.assign({ pin: S.pin, action: action }, extra || {}));
  const waitMs = { submit: 400000, uploadPhoto: 120000, config: 25000, listDrafts: 25000 }[action] || 60000;
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), waitMs) : null;
  const fail = (msg, kind) => { const e = new Error(msg); e[kind || 'server'] = true; return e; };
  // text/plain keeps this a simple request, which Apps Script accepts from another site.
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body,
    redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
    .catch(() => { throw fail('No connection', 'network'); })
    .then(resp => {
      if (resp.status >= 500) throw fail('The server is busy', 'network');
      return resp.text().then(text => ({ text: text, status: resp.status, from: resp.url }));
    })
    .then(ans => {
      const text = ans.text;
      let r;
      try { r = JSON.parse(text); }
      catch (x) {
        let host = '';
        try { host = new URL(ans.from).host; } catch (y) { host = String(ans.from || 'unknown'); }
        const start = String(text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220);
        throw fail('The script sent back an unexpected answer. Details: status ' + ans.status + ' from ' + host +
          ', answer: ' + (start ? '"' + start + '"' : 'empty'), 'glitch');
      }
      if (r && r.error) throw fail(r.error, r.retry ? 'busy' : 'server');
      return r;
    })
    .finally(() => { if (timer) clearTimeout(timer); });
}

/* ---------- storage on the phone ----------
 * Everything the agent does is written to the phone first (IndexedDB), then sent in the background.
 * insp:   one record per inspection (details, checklist, comments, signatures)
 * items:  one record per checklist item (rating, note, photo list)
 * photos: one small record per photo (details, sent or not)
 * blobs:  the photo files themselves (full size and report size)
 */
const DB_NAME = 'oakland-hill-inspection';
let dbPromise = null;
function db() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('This browser cannot store photos on the phone.'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore('insp', { keyPath: 'id' });
        d.createObjectStore('items', { keyPath: 'k' }).createIndex('insp', 'insp');
        d.createObjectStore('photos', { keyPath: 'key' }).createIndex('insp', 'insp');
        d.createObjectStore('blobs', { keyPath: 'key' });
      };
      req.onsuccess = () => { const d = req.result; d.onclose = () => { dbPromise = null; }; d.onversionchange = () => { d.close(); dbPromise = null; }; resolve(d); };
      req.onerror = () => reject(req.error || new Error('Phone storage is not available.'));
      req.onblocked = () => reject(new Error('Close any other tab with this form open, then reload.'));
    });
    dbPromise.catch(() => { dbPromise = null; });
  }
  return dbPromise;
}
function rq(r) {
  return new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
}
/** Runs fn inside one transaction. Resolves with fn's result only once the data is written to the phone. */
async function tx(names, mode, fn) {
  for (let attempt = 0; ; attempt++) {
    const d = await db();
    let t;
    try { t = d.transaction(names, mode); }
    catch (e) { dbPromise = null; if (attempt < 1) continue; throw e; }
    return await new Promise((resolve, reject) => {
      const st = {};
      [].concat(names).forEach(n => { st[n] = t.objectStore(n); });
      let out;
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Saving on the phone was cancelled.'));
      Promise.resolve().then(() => fn(st)).then(v => { out = v; }, e => { try { t.abort(); } catch (x) { } reject(e); });
    });
  }
}
function itemKey(inspId, itemId) { return inspId + '|' + itemId; }
function photoId(p) { return (p && (p.key || p.fileId)) || ''; }
function localGetInsp(id) { return tx('insp', 'readonly', s => rq(s.insp.get(id))); }
function localAllInsp() { return tx('insp', 'readonly', s => rq(s.insp.getAll())); }
function localItems(id) { return tx('items', 'readonly', s => rq(s.items.index('insp').getAll(id))); }
function readAllMeta() {
  return tx(['photos', 'items', 'insp'], 'readonly', async s =>
    [await rq(s.photos.getAll()), await rq(s.items.getAll()), await rq(s.insp.getAll())]);
}
function patchInsp(id, fn) {
  return tx('insp', 'readwrite', async s => {
    const r = await rq(s.insp.get(id));
    if (!r) return null;
    fn(r);
    await rq(s.insp.put(r));
    return r;
  });
}
function storageFail(e) {
  const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
  alert(quota
    ? 'The phone is out of space for this form. Free up some storage on the phone, then take the photo again.'
    : 'Could not save on this phone: ' + ((e && e.message) || e) + '. Reload the page, then check the last item.');
}

/** Saves the item as it is on screen to the phone, and the new photo with it if there is one. Then sends in the background. */
function saveItemLocal(id, photo) {
  const inspId = S.insp.InspectionID, r = res(id);
  const snap = { rating: r.rating, note: r.note, photos: r.photos.map(p => Object.assign({}, p)) };
  const names = photo ? ['items', 'photos', 'blobs'] : ['items'];
  return tx(names, 'readwrite', async s => {
    if (photo) {
      const meta = Object.assign({}, photo.meta);
      await rq(s.blobs.put({ key: meta.key, full: photo.full, small: photo.small }));
      await rq(s.photos.put({ key: meta.key, insp: inspId, itemId: id, meta: meta, logged: false, uploaded: false, err: '', at: Date.now() }));
    }
    const k = itemKey(inspId, id), cur = await rq(s.items.get(k));
    const known = {};
    (cur ? cur.photos : []).forEach(p => { known[photoId(p)] = p; });
    snap.photos.forEach(p => { const c = known[photoId(p)]; if (c && c.fileId && !p.fileId) FILE_FIELDS.forEach(f => { p[f] = c[f]; }); });
    const rev = Math.max(r.rev || 0, cur ? cur.rev || 0 : 0) + 1;
    await rq(s.items.put({ k: k, insp: inspId, itemId: id, rating: snap.rating, note: snap.note, photos: snap.photos,
      rev: rev, saved: cur ? cur.saved || 0 : 0, err: '' }));
    return { rev: rev, photos: snap.photos };
  }).then(out => {
    if (S.insp && S.insp.InspectionID === inspId) {
      const m = res(id);
      m.rev = out.rev;
      m.photos.forEach(p => {
        const c = out.photos.find(x => photoId(x) === photoId(p));
        if (c && c.fileId && !p.fileId) FILE_FIELDS.forEach(f => { p[f] = c[f]; });
      });
    }
    kickSync(); refreshCounts();
  });
}
function saveCommentsLocal() {
  const id = S.insp.InspectionID, text = S.sign.comments;
  return patchInsp(id, i => { i.comments = text; i.commentsRev = (i.commentsRev || 0) + 1; i.err = ''; })
    .then(() => { kickSync(); refreshCounts(); }, storageFail);
}
function saveSignLocal() {
  if (!S.insp) return;
  const sig = Object.assign({}, S.sig), sign = { declined: S.sign.declined, reason: S.sign.reason };
  patchInsp(S.insp.InspectionID, i => { i.sig = sig; i.sign = sign; }).catch(storageFail);
}

/** Puts what the server has into phone storage, without overwriting anything on the phone that hasn't been sent yet. */
function mergeServerCopy(r) {
  const id = r.inspection.InspectionID;
  return tx(['insp', 'items', 'photos'], 'readwrite', async s => {
    const rec = (await rq(s.insp.get(id))) || { id: id, comments: '', commentsRev: 0, commentsSaved: 0, sig: {}, sign: {} };
    rec.inspection = r.inspection;
    rec.checklist = r.checklist;
    if ((rec.commentsRev || 0) <= (rec.commentsSaved || 0)) rec.comments = r.inspection.TenantComments || '';
    await rq(s.insp.put(rec));
    const waiting = new Set((await rq(s.photos.index('insp').getAll(id))).filter(p => !p.uploaded).map(p => p.key));
    for (const it of r.checklist) {
      const k = itemKey(id, it.id);
      const loc = await rq(s.items.get(k));
      const sv = (r.results || {})[it.id];
      if (loc && ((loc.rev || 0) > (loc.saved || 0) || loc.photos.some(p => !p.fileId && waiting.has(p.key)))) continue;
      if (!sv && !loc) continue;
      const thumbs = {};
      (loc ? loc.photos : []).forEach(p => { if (p.thumb) thumbs[photoId(p)] = p.thumb; });
      const photos = (sv ? sv.photos || [] : []).map(p => Object.assign({}, p, thumbs[photoId(p)] ? { thumb: thumbs[photoId(p)] } : {}));
      const rev = loc ? loc.rev || 0 : 0;
      await rq(s.items.put({ k: k, insp: id, itemId: it.id, rating: sv ? sv.rating || '' : '', note: sv ? sv.note || '' : '',
        photos: photos, rev: rev, saved: rev, err: '' }));
    }
  });
}
/** Removes an inspection from the phone. Only called after it is submitted, or when nothing is left to send. */
function purgeLocal(id) {
  return tx(['insp', 'items', 'photos', 'blobs'], 'readwrite', async s => {
    await rq(s.insp.delete(id));
    for (const k of await rq(s.items.index('insp').getAllKeys(id))) await rq(s.items.delete(k));
    for (const k of await rq(s.photos.index('insp').getAllKeys(id))) { await rq(s.photos.delete(k)); await rq(s.blobs.delete(k)); }
  }).catch(() => { });
}

/* ---------- sync: sends what is on the phone to the owner's Sheet and Drive ----------
 * Two lanes send photos. One lane sends photo records, ratings and notes, and comments.
 * A lost connection pauses and retries. A refusal from the server is shown, and Sync now tries again.
 */
const SY = { lanes: 0, dataBusy: false, dataAgain: false, upAgain: false, offline: false, busyKeys: new Set(), by: {}, wakers: [] };

function wake() { const w = SY.wakers; SY.wakers = []; w.forEach(f => f()); }
function pause(ms) {
  return new Promise(resolve => {
    let t = null;
    const done = () => { clearTimeout(t); resolve(); };
    t = setTimeout(done, ms);
    SY.wakers.push(done);
  });
}
function kickSync() {
  if (!S.pin) return;
  if (SY.dataBusy) SY.dataAgain = true; else dataLane();
  SY.upAgain = true;
  while (SY.lanes < UPLOAD_LANES) { SY.lanes++; uploadLane(); }
}
function syncNow() {
  tx(['photos', 'items', 'insp'], 'readwrite', async s => {
    for (const p of await rq(s.photos.getAll())) if (p.err) { p.err = ''; await rq(s.photos.put(p)); }
    for (const it of await rq(s.items.getAll())) if (it.err) { it.err = ''; await rq(s.items.put(it)); }
    for (const i of await rq(s.insp.getAll())) if (i.err) { i.err = ''; await rq(s.insp.put(i)); }
  }).catch(() => { }).then(() => {
    SY.offline = false; wake(); kickSync(); refreshCounts();
    toast(navigator.onLine === false ? 'No signal on this phone. It keeps trying.' : 'Syncing');
  });
}
function markMany(store, keys, msg) {
  return tx(store, 'readwrite', async s => {
    for (const k of keys) { const r = await rq(s[store].get(k)); if (r) { r.err = String(msg).slice(0, 300); await rq(s[store].put(r)); } }
  });
}

async function uploadLane() {
  let fails = 0;
  try {
    while (true) {
      SY.upAgain = false;
      const list = await tx('photos', 'readonly', s => rq(s.photos.getAll()));
      const next = list.filter(p => !p.uploaded && !p.err && !SY.busyKeys.has(p.key)).sort((a, b) => a.at - b.at)[0];
      if (!next) { if (SY.upAgain) continue; break; }
      SY.busyKeys.add(next.key);
      try {
        const file = await tx('blobs', 'readonly', s => rq(s.blobs.get(next.key)));
        if (!file) { await markMany('photos', [next.key], 'The photo file is missing on this phone.'); continue; }
        const m = next.meta;
        const up = await call('uploadPhoto', { id: next.insp, key: next.key, data: {
          itemId: next.itemId, full: bufToB64(file.full), small: bufToB64(file.small), name: m.name, hash: m.hash,
          takenAt: m.takenAt, takenAtText: m.takenAtText, gpsText: m.gpsText, source: m.source } });
        await photoArrived(next, up);
        SY.offline = false; fails = 0;
      } catch (e) {
        if (e.network || e.busy) {
          if (e.network) SY.offline = true;
          refreshCounts();
          await pause(Math.min(30000, 5000 * ++fails));
        } else {
          await markMany('photos', [next.key], e.message);
        }
      } finally {
        SY.busyKeys.delete(next.key);
      }
      refreshCounts();
    }
  } catch (e) { /* phone storage problem: the next Sync now or timer tries again */ }
  finally { SY.lanes--; refreshCounts(); }
}

/** A photo reached Drive: record the Drive link on the phone, then the item is re-sent with the link. */
function photoArrived(rec, up) {
  const fields = {};
  FILE_FIELDS.forEach(f => { fields[f] = up[f]; });
  return tx(['photos', 'items'], 'readwrite', async s => {
    const p = await rq(s.photos.get(rec.key));
    if (p) { p.uploaded = true; p.logged = true; p.err = ''; await rq(s.photos.put(p)); }
    const it = await rq(s.items.get(itemKey(rec.insp, rec.itemId)));
    if (!it) return null;
    let found = false;
    it.photos.forEach(x => { if (x.key === rec.key) { Object.assign(x, fields); found = true; } });
    if (!found) return null;
    it.rev = (it.rev || 0) + 1;
    await rq(s.items.put(it));
    return it;
  }).then(it => {
    if (it && S.insp && S.insp.InspectionID === rec.insp) {
      const r = res(rec.itemId);
      r.rev = Math.max(r.rev || 0, it.rev);
      r.photos.forEach(x => { if (x.key === rec.key) Object.assign(x, fields); });
      renderItem(rec.itemId);
    }
    kickSync();
  });
}

async function dataLane() {
  SY.dataBusy = true;
  let fails = 0;
  try {
    while (true) {
      SY.dataAgain = false;
      const job = await nextDataJob();
      if (!job) { if (SY.dataAgain) continue; break; }
      try { await job.run(); SY.offline = false; fails = 0; }
      catch (e) {
        if (e.network || e.busy) {
          if (e.network) SY.offline = true;
          refreshCounts();
          await pause(Math.min(30000, 5000 * ++fails));
        } else {
          await job.fail(e.message);
        }
      }
      refreshCounts();
    }
  } catch (e) { }
  finally { SY.dataBusy = false; refreshCounts(); }
}

async function nextDataJob() {
  const [photos, items, insps] = await readAllMeta();

  // 1. Tell the server about photos saved on the phone, so it records a time close to capture.
  const unlogged = photos.filter(p => !p.logged && !p.uploaded && !p.err);
  if (unlogged.length) {
    const id = unlogged[0].insp, batch = unlogged.filter(p => p.insp === id).slice(0, 25);
    return {
      run: async () => {
        await call('logPhotos', { id: id, data: { photos: batch.map(p => Object.assign({ key: p.key, itemId: p.itemId }, p.meta)) } });
        await tx('photos', 'readwrite', async s => {
          for (const b of batch) { const p = await rq(s.photos.get(b.key)); if (p) { p.logged = true; await rq(s.photos.put(p)); } }
        });
      },
      fail: msg => markMany('photos', batch.map(p => p.key), msg)
    };
  }

  // 2. Ratings, notes and photo links, once the item's photos are in Drive.
  const notSent = new Set(photos.filter(p => !p.uploaded).map(p => p.key));
  const dirty = items.filter(it => (it.rev || 0) > (it.saved || 0) && !it.err && it.photos.every(p => p.fileId || !notSent.has(p.key)));
  if (dirty.length) {
    const id = dirty[0].insp, batch = dirty.filter(it => it.insp === id).slice(0, 40);
    return {
      run: async () => {
        const r = await call('saveItems', { id: id, data: { items: batch.map(it => ({ itemId: it.itemId, rating: it.rating, note: it.note,
          photos: it.photos.filter(p => p.fileId).map(p => { const c = Object.assign({}, p); delete c.thumb; return c; }) })) } });
        const failed = r.failed || {};
        await tx('items', 'readwrite', async s => {
          for (const b of batch) {
            const it = await rq(s.items.get(b.k));
            if (!it) continue;
            if (failed[b.itemId]) it.err = failed[b.itemId]; else it.saved = Math.max(it.saved || 0, b.rev || 0);
            await rq(s.items.put(it));
          }
        });
      },
      fail: msg => markMany('items', batch.map(it => it.k), msg)
    };
  }

  // 3. Tenant comments.
  const ins = insps.find(i => (i.commentsRev || 0) > (i.commentsSaved || 0) && !i.err);
  if (ins) {
    return {
      run: async () => {
        await call('saveHeader', { id: ins.id, data: { TenantComments: ins.comments || '' } });
        await patchInsp(ins.id, i => { i.commentsSaved = Math.max(i.commentsSaved || 0, ins.commentsRev); });
      },
      fail: msg => patchInsp(ins.id, i => { i.err = msg; })
    };
  }
  return null;
}

/* ---------- sync status ---------- */
let countTimer = null;
function refreshCounts() { clearTimeout(countTimer); countTimer = setTimeout(countNow, 150); }
async function countNow() {
  try {
    const [photos, items, insps] = await readAllMeta();
    const by = {};
    const slot = id => by[id] || (by[id] = { photos: 0, changes: 0, errors: 0, firstError: '' });
    const bad = (b, msg) => { b.errors++; if (!b.firstError) b.firstError = msg; };
    photos.forEach(p => { if (p.uploaded) return; const b = slot(p.insp); if (p.err) bad(b, p.err); else b.photos++; });
    items.forEach(it => { if ((it.rev || 0) <= (it.saved || 0)) return; const b = slot(it.insp); if (it.err) bad(b, it.err); else b.changes++; });
    insps.forEach(i => { if ((i.commentsRev || 0) <= (i.commentsSaved || 0)) return; const b = slot(i.id); if (i.err) bad(b, i.err); else b.changes++; });
    SY.by = by;
  } catch (e) { }
  setSync(); refreshFooter(); refreshSyncBoxes();
}
function syncInfo(id) {
  const z = { photos: 0, changes: 0, errors: 0, firstError: '' };
  if (id) return SY.by[id] || z;
  Object.keys(SY.by).forEach(k => { const b = SY.by[k]; z.photos += b.photos; z.changes += b.changes; z.errors += b.errors; z.firstError = z.firstError || b.firstError; });
  return z;
}
function setSync() {
  const el = $('#sync'), t = syncInfo(), n = t.photos + t.changes;
  if (!S.pin || (!S.insp && !n && !t.errors) || S.view === 'done') { el.hidden = true; return; }
  el.hidden = false;
  if (t.errors) { el.textContent = t.errors + ' not sent, tap'; el.className = 'warn'; }
  else if (!n) { el.textContent = 'All synced'; el.className = ''; }
  else if (SY.offline) { el.textContent = 'No signal, ' + n + ' waiting'; el.className = 'warn'; }
  else { el.textContent = 'Sending ' + n; el.className = ''; }
}
function syncBox(id) {
  const t = syncInfo(id), n = t.photos + t.changes;
  if (!n && !t.errors) return '<div class="muted">All synced. Everything on this phone has reached the owner\'s Sheet and Drive.</div>';
  const parts = [];
  if (t.photos) parts.push(t.photos + (t.photos === 1 ? ' photo' : ' photos'));
  if (t.changes) parts.push(t.changes + (t.changes === 1 ? ' change' : ' changes'));
  let h = '';
  if (parts.length) {
    h += `<div class="muted">Saved on this phone, still to send: ${parts.join(' and ')}. ` +
      (SY.offline ? 'No signal right now. It keeps trying.' : 'Sending now. Keep this page open and on screen.') + '</div>';
  }
  if (t.errors) h += `<div class="err">${t.errors} could not be sent: ${esc(t.firstError)}</div>`;
  return h + '<button class="btn sec" data-act="sync">Sync now</button>';
}
function refreshSyncBoxes() {
  document.querySelectorAll('[data-syncbox]').forEach(el => {
    const id = el.dataset.syncbox || null, t = syncInfo(id);
    if (el.dataset.quiet && !t.photos && !t.changes && !t.errors) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = syncBox(id);
  });
}
window.addEventListener('online', () => { SY.offline = false; wake(); kickSync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); kickSync(); refreshCounts(); } });
setInterval(() => { if (S.pin) kickSync(); }, 20000);

/* ---------- rules (same as the server) ---------- */
function res(id) { return S.results[id] || (S.results[id] = { rating: '', note: '', photos: [], rev: 0 }); }
function photoOnly(it) { return Number(it.min) >= 2; }
function needPhotos(it, r) {
  let n = Number(it.min) || 0;
  if (it.photo) n = Math.max(n, 1);
  if (r && (r.rating === 'Wear' || r.rating === 'Damage')) n = Math.max(n, 1);
  return n;
}
function problem(it) {
  const r = res(it.id), have = r.photos.length;
  if (!photoOnly(it) && !r.rating) return 'Not rated';
  const n = needPhotos(it, r);
  if (have < n) return (n - have) === 1 ? '1 photo needed' : (n - have) + ' photos needed';
  if (r.rating === 'Damage' && !r.note.trim()) return 'Note needed';
  return '';
}
function incomplete() { return S.checklist.filter(it => problem(it)); }
function rooms() {
  const m = [];
  S.checklist.forEach(it => {
    let g = m.find(x => x.name === it.room);
    if (!g) { g = { name: it.room, items: [] }; m.push(g); }
    g.items.push(it);
  });
  return m;
}
function hint(it) {
  const r = res(it.id), h = [];
  if (it.guide) h.push(it.guide);
  if (it.test) h.push('Test it works.');
  if (photoOnly(it)) h.push('Take ' + it.min + ' wide shots from opposite corners.');
  else if (it.photo) h.push('Photo required.');
  if (r.rating === 'Wear' || r.rating === 'Damage') h.push('Take a close-up of the ' + r.rating.toLowerCase() + '.');
  return h.join(' ');
}

/* ---------- rendering ---------- */
function go(view, opts) {
  Object.assign(S, opts || {}); S.view = view;
  if (S.insp && ['rooms', 'room', 'review'].includes(view)) {
    local('set', 'resume', JSON.stringify({ id: S.insp.InspectionID, room: view === 'room' ? S.room : '' }));
  }
  render(); window.scrollTo(0, 0);
}
function render() {
  window.APP_STARTED = true;
  const v = S.view;
  const parent = { start: S.editStart ? 'rooms' : 'home', rooms: 'home', room: 'rooms', review: 'rooms', sign: 'review' }[v];
  $('#back').hidden = !parent;
  $('#back').onclick = () => goBack(parent);
  const titles = { pin: CFG.property, home: CFG.property, start: S.editStart ? 'Start details' : 'New inspection',
    rooms: S.insp ? S.insp.InspectionType + ' inspection' : '', room: S.room, review: 'Review', sign: 'Sign-off', done: 'Submitted' };
  $('#title').textContent = titles[v] || CFG.property;
  const views = { pin: viewPin, home: viewHome, start: viewStart, rooms: viewRooms, room: viewRoom, review: viewReview, sign: viewSign, done: viewDone };
  $('#app').innerHTML = views[v]();
  if (v === 'sign') initSign();
  if (v === 'pin') { const p = $('#pin'); if (p) p.focus(); }
  setSync(); refreshFooter(); refreshSyncBoxes();
}
async function goBack(to) {
  if (to === 'home') {
    S.insp = null; S.checklist = []; S.results = {}; local('set', 'resume', '');
    try { await loadDrafts(); }
    catch (e) { if (e.network || e.glitch) await useLocalDrafts(); else toast(errText(e), 6000); }
  }
  go(to, to === 'rooms' ? { editStart: false } : {});
}

function itemCard(it) {

  }

      : `<div class="thumb" data-act="rmPhoto" data-id="${esc(it.id)}" data-i="${i}">Photo ${i + 1} saved ${esc((p.takenAtText || '').slice(11, 16))}</div>`).join('');

      <div id="reasonBox" ${S.sign.declined ? '' : 'hidden'}><label for="sReason">Reason</label>
        <input id="sReason" type="text" value="${esc(S.sign.reason)}" placeholder="For example: not present, refused to sign"></div></div>`;
}

function viewDone() {
  const r = S.doneInfo || {};
  const msg = r.reportOk
    ? 'The report has been emailed to you and the owner.'
    : 'The inspection is saved and locked. The report is delayed, and the owner has been told.';
  return `<div class="card"><h2>Inspection submitted</h2><p>${msg}</p>
    <p class="muted">It can no longer be changed.</p>
    <button class="btn" data-act="home">Back to start</button></div>`;
}

function refreshFooter() {
  const f = $('#footer'); let h = '';
  if (S.view === 'rooms') h = '<button class="btn" data-act="review">Review and sign-off</button>';
  else if (S.view === 'room') {
    const rs = rooms(), i = rs.findIndex(r => r.name === S.room);
    h = i >= 0 && i < rs.length - 1
      ? `<button class="btn" data-act="room" data-room="${esc(rs[i + 1].name)}">Next: ${esc(rs[i + 1].name)}</button>`
      : '<button class="btn" data-act="review">Review</button>';
  } else if (S.view === 'review') {
    const n = incomplete().length;
    h = `<button class="btn" data-act="sign" ${n ? 'disabled' : ''}>${n ? n + ' item' + (n > 1 ? 's' : '') + ' still to complete' : 'Continue to sign-off'}</button>`;
  } else if (S.view === 'sign') {
    const m = signMissing();
    h = `<button class="btn" data-act="submit" ${m ? 'disabled' : ''}>${m ? esc(m) : 'Submit inspection'}</button>`;
  }
  if (f._h !== h) { f.innerHTML = h; f._h = h; }
  f.hidden = !h;
}
function signMissing() {
  const n = incomplete().length;
  if (n) return n + ' item(s) still to complete';
  if (!S.sig.agent) return 'Agent signature needed';
  if (S.sign.declined) { if (!S.sign.reason.trim()) return 'Reason needed'; }
  else if (!S.sig.tenant) return 'Tenant signature needed';
  const t = syncInfo(S.insp.InspectionID);
  if (t.errors) return 'Not all sent. Tap Sync now above';
  if (t.photos + t.changes) return 'Waiting for ' + (t.photos + t.changes) + ' to sync. Keep page open';
  return '';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');

    case 'startGo': return startGo();

/* ---------- PIN, home, start ---------- */
async function pinGo() {
  const pin = ($('#pin').value || '').trim();
  if (!pin) return;
  S.pin = pin;
  try {
    await loadDrafts();
    store('set', 'pin', pin);
    local('set', 'pinHash', await pinHash(pin));
  } catch (e) {
    const saved = local('get', 'pinHash');
    if ((e.network || e.glitch) && saved && saved === await pinHash(pin)) {
      store('set', 'pin', pin);
      await useLocalDrafts();
    } else {
      S.pin = '';
      $('#pinErr').textContent = errText(e);
      return;
    }
  }
  watchGps(); await resumeOrHome();
}
async function loadDrafts() {
  const r = await call('listDrafts');
  S.drafts = r.drafts || [];
  S.offlineMode = false;
  await tidyLocal();
}
/** No signal: list the inspections saved on this phone instead. */
async function useLocalDrafts() {
  let list = [];
  try { list = await localAllInsp(); } catch (e) { }
  S.drafts = list.filter(i => i.inspection).map(i => ({ id: i.id, type: i.inspection.InspectionType, tenant: i.inspection.TenantNames, created: i.inspection.CreatedAt }));
  S.offlineMode = true;
}
/** Clears phone copies of inspections that are no longer open, but only when nothing is left to send. */
async function tidyLocal() {
  try {
    const open = new Set(S.drafts.map(d => d.id));
    await countNow();
    for (const i of await localAllInsp()) {
      if (open.has(i.id)) continue;
      const t = syncInfo(i.id);
      if (!t.photos && !t.changes && !t.errors) await purgeLocal(i.id);
    }
    refreshCounts();
  } catch (e) { }
}
function newInspection() {
  S.startDraft = { AgentName: local('get', 'agentName') || '', AgentEmail: local('get', 'agentEmail') || '' };
  S.startKey = '';
  go('start', { editStart: false });
}
/** If the phone reloaded the page mid-inspection, go straight back to where the agent was. */
async function resumeOrHome() {
  let rs = null;
  try { rs = JSON.parse(local('get', 'resume') || 'null'); } catch (e) { }
  if (rs && rs.id && S.drafts.some(d => d.id === rs.id)) {
    try {
      await openInspection(rs.id);
      const hasRoom = rs.room && S.checklist.some(it => it.room === rs.room);
      go(hasRoom ? 'room' : 'rooms', hasRoom ? { room: rs.room } : {});
      kickSync();
      return toast('Back in your inspection. Check the last item you were on.', 5000);
    } catch (e) { }
  }
  local('set', 'resume', '');
  go('home');
  kickSync();
}
async function openDraft(id) {
  if (S.busy) return;
  S.busy = true; toast('Opening inspection');
  try { await openInspection(id); go('rooms'); watchGps(); kickSync(); }
  catch (e) { alert(errText(e)); }
  S.busy = false;
}
/** Loads the server copy when there is signal, merges it with the phone copy, and works from the phone copy. */
async function openInspection(id) {
  let r = null;
  if (!S.offlineMode) {
    try { r = await call('load', { id: id }); }
    catch (e) { if (!(e.network || e.glitch)) throw e; }
  }
  if (r) await mergeServerCopy(r);
  await openLocal(id, !r);
}
async function openLocal(id, noSignal) {
  const rec = await localGetInsp(id);
  if (!rec || !rec.inspection) throw new Error('No connection, and this inspection is not saved on this phone. Try again with signal.');
  const items = await localItems(id);
  S.insp = rec.inspection; S.checklist = rec.checklist || []; S.results = {};
  items.forEach(it => { S.results[it.itemId] = { rating: it.rating || '', note: it.note || '', photos: it.photos || [], rev: it.rev || 0 }; });
  S.sig = Object.assign({ agent: null, tenant: null }, rec.sig || {});
  S.sign = Object.assign({ declined: false, reason: '' }, rec.sign || {}, { comments: rec.comments || '' });
  if (noSignal) toast('No signal. Working from the copy saved on this phone.', 5000);
  refreshCounts();
}
function collectStart() {
  ['AgentName', 'AgentEmail', 'TenantNames', 'TenantEmail', 'WaterReading', 'ElectricityReading', 'KeysCount', 'RemotesCount', 'AlarmCode']
    .forEach(k => { const el = $('#f_' + k); if (el) S.startDraft[k] = el.value.trim(); });
}
async function startGo() {
  if (S.busy) return;
  collectStart();
  const d = S.startDraft, err = $('#startErr');
  const labels = { InspectionType: 'Inspection type', AgentName: 'Agent name', AgentEmail: 'Agent email', TenantNames: 'Tenant name',
    TenantEmail: 'Tenant email', WaterReading: 'Water meter', ElectricityReading: 'Electricity', KeysCount: 'Full key sets', RemotesCount: 'Number of remotes', AlarmCode: 'Current alarm code' };
  const missing = Object.keys(labels).filter(k => !String(d[k] || '').trim());
  if (missing.length) { err.textContent = labels[missing[0]] + ' is required.'; return; }
  S.busy = true; err.textContent = '';
  const btn = document.querySelector('[data-act=startGo]'); btn.disabled = true; btn.textContent = 'Saving';
  try {
    if (S.editStart) {
      const r = await call('saveHeader', { id: S.insp.InspectionID, data: d });
      S.insp = r.inspection;
      await patchInsp(S.insp.InspectionID, i => { i.inspection = r.inspection; }).catch(() => { });
      S.busy = false;
      return go('rooms', { editStart: false });
    }
    let gps = null;
    try { gps = await getGps(); }
    catch (e) {
      if (CFG.requireGps) throw new Error('Location is needed. Allow location for this page and turn on GPS, then try again.');
    }

    if (!S.startKey) S.startKey = newKey();

    await mergeServerCopy(r);
    await openLocal(r.inspection.InspectionID, false);
    S.busy = false;

    err.textContent = e.network ? 'No connection. Starting or editing an inspection needs signal. Try again in a moment.' : errText(e);

/* ---------- ratings and saving ---------- */
function setRating(id, v) {
  const r = res(id);
  r.rating = v;
  if (v === 'Good') r.note = '';
  renderItem(id);
  saveItemLocal(id).catch(storageFail);
}
function removePhoto(id, i) {
  if (!confirm("Remove this photo from the item? A copy is still sent to the owner's Drive.")) return;
  res(id).photos.splice(i, 1);
  renderItem(id);
  saveItemLocal(id).catch(storageFail);
}

/* ---------- location ---------- */
function watchGps() {
  if (S.watching || !navigator.geolocation) return;
  S.watching = true;
  navigator.geolocation.watchPosition(p => {
    S.gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
  }, () => { }, { enableHighAccuracy: true, maximumAge: 15000 });
}
function getGps() {
  if (S.gps && Date.now() - S.gps.at < 60000) return Promise.resolve(S.gps);
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('This browser does not give a location.'));
    navigator.geolocation.getCurrentPosition(p => {
      S.gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
      resolve(S.gps);
    }, e => reject(new Error(e.message || 'Location not available')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  });
}

/* ---------- camera ---------- */
async function takePhoto(id) {
  if (S.busyPhoto) return;
  const it = S.checklist.find(x => x.id === id), r = res(id);
  if (r.photos.length >= CFG.maxPhotos) return toast('Maximum ' + CFG.maxPhotos + ' photos per item.');
  let shot;
  try { shot = await capture(); }
  catch (e) { if (e.message !== 'cancel') alert(e.message); return; }

  let gps = null;
  try { gps = await getGps(); }
  catch (e) {
    if (CFG.requireGps) { alert('Location is needed to stamp the photo. Allow location for this page and turn on GPS, then take the photo again.'); return; }
  }

  S.busyPhoto = true;
  let p = null;
  try {
    const base = shot.canvas;
    stampOn(base, it, shot.takenAt, gps);
    const full = await canvasBuf(base, 0.82);
    const smallCanvas = scaleCanvas(base, base.width, base.height, 900);
    freeCanvas(base); shot.canvas = null;
    const small = await canvasBuf(smallCanvas, 0.7);
    const thumbCanvas = scaleCanvas(smallCanvas, smallCanvas.width, smallCanvas.height, 160);
    freeCanvas(smallCanvas);
    const thumb = thumbCanvas.toDataURL('image/jpeg', 0.6);
    freeCanvas(thumbCanvas);

    const key = newKey();
    const meta = {
      key: key, name: String(id).replace(/[^\w-]/g, '') + '_' + fileStamp(shot.takenAt) + '_' + key.slice(-4) + '.jpg',
      hash: await sha256Hex(full), takenAt: shot.takenAt.toISOString(), takenAtText: fmtSA(shot.takenAt),
      lat: gps ? gps.lat : null, lng: gps ? gps.lng : null, acc: gps ? gps.acc : null, gpsText: gpsText(gps), source: shot.source
    };
    p = Object.assign({ thumb: thumb }, meta);
    r.photos.push(p);
    await saveItemLocal(id, { meta: meta, full: full, small: small });
    renderItem(id);
  } catch (e) {
    if (p) { r.photos = r.photos.filter(x => x !== p); renderItem(id); }
    storageFail(e);
  } finally {
    S.busyPhoto = false;
  }
}

function capture() {
  if (!S.noLive && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    return liveCapture().catch(e => {
      if (e.message === 'cancel') throw e;
      S.noLive = true;
      return fileCaptureViaButton();
    });
  }
  return fileCapture();
}

/** Preferred: live camera inside the page. There is no way to pick a gallery photo here. */
function liveCapture() {
  return new Promise((resolve, reject) => {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1600 }, height: { ideal: 1200 } }, audio: false })
      .then(stream => {
        const ov = overlay(`<video autoplay playsinline muted></video>
          <div class="row2" style="margin-top:12px"><div><button class="btn sec" data-x="cancel">Cancel</button></div>
          <div><button class="btn" data-x="snap">Take photo</button></div></div>
          <button class="small-btn" data-x="fallback">Camera not showing? Use the phone camera</button>`);
        const v = ov.querySelector('video');
        v.srcObject = stream;
        const playing = v.play(); if (playing && playing.catch) playing.catch(() => { });
        const stop = () => { stream.getTracks().forEach(t => t.stop()); v.pause(); v.srcObject = null; ov.remove(); };
        ov.querySelector('[data-x=cancel]').onclick = () => { stop(); reject(new Error('cancel')); };
        ov.querySelector('[data-x=fallback]').onclick = () => { stop(); reject(new Error('fallback')); };
        ov.querySelector('[data-x=snap]').onclick = () => {
          if (!v.videoWidth) return;
          const c = scaleCanvas(v, v.videoWidth, v.videoHeight, 1600);
          const t = new Date();
          stop();
          resolve({ canvas: c, takenAt: t, source: 'In-app camera' });
        };
      })
      .catch(reject);
  });
}

function fileCaptureViaButton() {
  return new Promise((resolve, reject) => {
    const ov = overlay(`<p>Tap below to open the phone camera. Take the photo straight away. Photos older than ${CFG.maxAge} minutes are rejected.</p>
      <div class="row2"><div><button class="btn sec" data-x="cancel">Cancel</button></div>
      <div><button class="btn" data-x="open">Open camera</button></div></div>`);
    ov.querySelector('[data-x=cancel]').onclick = () => { ov.remove(); reject(new Error('cancel')); };
    ov.querySelector('[data-x=open]').onclick = () => { ov.remove(); fileCapture().then(resolve, reject); };
  });
}

/** Fallback: the phone's camera app. Old photos are rejected using the time inside the photo. */
function fileCapture() {
  return new Promise((resolve, reject) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return reject(new Error('cancel'));
      try {
        const head = await readHead(f, 262144);
        const exif = readExifDate(head);
        const takenAt = exif || new Date(f.lastModified || Date.now());
        const ageMin = (Date.now() - takenAt.getTime()) / 60000;
        if (ageMin > CFG.maxAge || ageMin < -5) {
          return reject(new Error('This photo was taken at ' + fmtSA(takenAt) + ', not in the last ' + CFG.maxAge + ' minutes. Take a new photo now.'));
        }
        const img = await loadImage(f);
        const c = scaleCanvas(img, img.naturalWidth, img.naturalHeight, 1600);
        URL.revokeObjectURL(img.src); img.src = '';
        resolve({ canvas: c, takenAt: takenAt, source: exif ? 'Phone camera (photo time)' : 'Phone camera (file time)' });
      } catch (e) {
        reject(new Error('Could not read the photo. Try again.'));
      }
    };
    inp.click();
  });
}

function readHead(file, n) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsArrayBuffer(file.slice(0, n));
  });
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('decode'));
    img.src = URL.createObjectURL(file);
  });
}

/** Reads DateTimeOriginal from a JPEG. Returns a Date or null. */
function readExifDate(buf) {
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off + 10 < v.byteLength) {
      const marker = v.getUint16(off), len = v.getUint16(off + 2);
      if ((marker & 0xFF00) !== 0xFF00) return null;
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        const t = off + 10, le = v.getUint16(t) === 0x4949;
        const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
        const ifd = o => {
          const tags = {}, n = u16(o);
          for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; tags[u16(e)] = { count: u32(e + 4), at: e + 8 }; }
          return tags;
        };
        const str = tag => {
          const start = tag.count > 4 ? t + u32(tag.at) : tag.at;
          let s = '';
          for (let i = 0; i < tag.count - 1 && start + i < v.byteLength; i++) s += String.fromCharCode(v.getUint8(start + i));
          return s;
        };
        const ifd0 = ifd(t + u32(t + 4));
        let dt = '';
        if (ifd0[0x8769]) { const ex = ifd(t + u32(ifd0[0x8769].at)); if (ex[0x9003]) dt = str(ex[0x9003]); }
        if (!dt && ifd0[0x0132]) dt = str(ifd0[0x0132]);
        const m = dt.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
      }
      off += 2 + len;
    }
  } catch (e) { }
  return null;
}

/** Phones (iPhones especially) hold canvas memory until the size is set to zero. */
function freeCanvas(c) {
  if (c && c.getContext) { c.width = 0; c.height = 0; }
}

function scaleCanvas(src, w, h, max) {
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

/** Burns the item reference, date, time and GPS onto the photo. */
function stampOn(c, it, when, gps) {
  const ctx = c.getContext('2d'), W = c.width, H = c.height;
  const fs = Math.max(14, Math.round(Math.min(W, H) * 0.034)), pad = Math.round(fs * 0.55), lh = fs * 1.3;
  const lines = [
    it.id + ' | ' + it.item,
    CFG.property + ' | ' + fmtSA(when) + ' SAST',
    gps ? 'GPS ' + gps.lat.toFixed(6) + ', ' + gps.lng.toFixed(6) + ' (+/- ' + Math.round(gps.acc) + ' m)' : 'GPS not available'
  ];
  const bh = lines.length * lh + pad * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, H - bh, W, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '600 ' + fs + 'px Arial, sans-serif';
  ctx.textBaseline = 'top';
  lines.forEach((line, i) => {
    let s = line;
    if (ctx.measureText(s).width > W - pad * 2) {
      while (s.length > 4 && ctx.measureText(s + '...').width > W - pad * 2) s = s.slice(0, -1);
      s += '...';
    }
    ctx.fillText(s, pad, H - bh + pad + i * lh);
  });
}

/* ---------- sign-off ---------- */
function initSign() {
  initPad('agent');
  if (!S.sign.declined) initPad('tenant');
  const box = $('#sComments');
  box.addEventListener('input', e => {
    S.sign.comments = e.target.value;
    clearTimeout(S.noteTimers.comments);
    S.noteTimers.comments = setTimeout(saveCommentsLocal, 800);
  });
  box.addEventListener('change', e => {
    S.sign.comments = e.target.value;
    clearTimeout(S.noteTimers.comments);
    saveCommentsLocal();
  });
  $('#sDeclined').addEventListener('change', e => {
    S.sign.declined = e.target.checked;
    $('#tenantPad').hidden = S.sign.declined;
    $('#reasonBox').hidden = !S.sign.declined;
    if (!S.sign.declined) initPad('tenant');
    saveSignLocal();
    refreshFooter();
  });
  $('#sReason').addEventListener('input', e => { S.sign.reason = e.target.value; saveSignLocal(); refreshFooter(); });
}

function initPad(key) {
  const canvas = document.getElementById(key === 'agent' ? 'sigAgent' : 'sigTenant');
  if (!canvas) return;
  const box = canvas.getBoundingClientRect();
  if (!box.width) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, box.width, box.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  if (S.sig[key]) {
    const im = new Image();
    im.onload = () => ctx.drawImage(im, 0, 0, box.width, box.height);
    im.src = S.sig[key];
  }
  let drawing = false, last = null;
  const pt = e => { const b = canvas.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  canvas.onpointerdown = e => {
    drawing = true; last = pt(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (x) { }
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y + 0.1); ctx.stroke();
  };
  canvas.onpointermove = e => {
    if (!drawing) return;
    const p = pt(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  };
  const end = () => { if (!drawing) return; drawing = false; S.sig[key] = canvas.toDataURL('image/png'); saveSignLocal(); refreshFooter(); };
  canvas.onpointerup = end; canvas.onpointercancel = end; canvas.onpointerleave = end;
}

async function submitInspection() {
  const miss = signMissing();
  if (miss) return toast(miss);
  if (!confirm('Submit now? Once submitted, this inspection is locked and cannot be changed.')) return;
  const id = S.insp.InspectionID;
  const ov = overlay('<h2>Submitting</h2><p>Building the report with all photos. This can take a minute or two. Keep this page open.</p>');
  try {
    const r = await call('submit', { id: id, data: {
      tenantComments: S.sign.comments, agentSig: S.sig.agent, tenantSig: S.sign.declined ? '' : S.sig.tenant,
      tenantDeclined: S.sign.declined, declineReason: S.sign.reason } });
    ov.remove();
    S.insp.Status = 'Submitted';
    local('set', 'resume', '');
    await purgeLocal(id);
    refreshCounts();
    go('done', { doneInfo: r });
  } catch (e) {
    ov.remove();
    alert(e.network ? 'Could not confirm the submit. Nothing is lost, it is all still on this phone. Check signal and tap Submit again. If it was already submitted, it will say so.' : 'Not submitted: ' + e.message);
  }
}

window.addEventListener('error', e => toast('Something went wrong: ' + e.message, 6000));

/* ---------- start ---------- */
(async function init() {
  if (API_URL.indexOf('https://script.google.com/') !== 0 || !/\/exec$/.test(API_URL)) {
    return showStartupProblem('The Web app URL is not set. In GitHub, check there is a file called config.js next to index.html, with your URL ending in /exec between the quotes. Commit, wait a few minutes, then reload.');
  }
  try { await tx('insp', 'readonly', s => rq(s.insp.count())); }
  catch (e) {
    return showStartupProblem('This browser cannot save photos on the phone, so the form cannot run. Use Chrome (Android) or Safari (iPhone) in a normal tab, not a private or incognito tab. Details: ' + ((e && e.message) || e));
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }

  let cfg = null, noSignal = false;
  try { cfg = await call('config'); }
  catch (e) {
    let cached = null;
    try { cached = JSON.parse(local('get', 'cfg') || 'null'); } catch (x) { }
    if ((e.network || e.glitch) && cached && cached.version === PAGE_VERSION) { cfg = cached; noSignal = true; }
    else {
      return showStartupProblem(e.glitch
        ? 'Google did not send an answer back after several tries. Reload the page. ' + e.message
        : e.network
          ? 'Could not reach the script. Check signal, then reload. If this keeps happening, check the URL in config.js and that the deployment has access set to Anyone.'
          : 'Could not load settings from the script. ' + e.message);
    }
  }
  if (!cfg || cfg.version !== PAGE_VERSION) {
    return showStartupProblem('Code.gs and index.html are from different versions (script: ' +
      ((cfg && cfg.version) || 'old') + ', page: ' + PAGE_VERSION + '). Update both: deploy a new version in Apps Script and commit index.html in GitHub. GitHub can take up to 10 minutes to show a change, so wait, then close this tab and open the link again.');
  }
  if (!noSignal) local('set', 'cfg', JSON.stringify(cfg));
  Object.assign(CFG, cfg);
  refreshCounts();
  if (S.pin) {
    try { await loadDrafts(); }
    catch (e) {
      if (e.network || e.glitch) await useLocalDrafts();
      else { S.pin = ''; store('set', 'pin', ''); return go('pin'); }
    }
    watchGps();
    return resumeOrHome();
  }
  go('pin');
})();
</script>
